# Builds everything Terraform deploys, as artifacts for the job that runs it:
# the frontend (frontend/build), and each Lambda's package
# (<project>/.build/lambda.zip). Used by deploy.yml and plan.yml.

name: Build

on:
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend
          path: frontend/build
          if-no-files-found: error

  lambdas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Pinned: package metadata varies by uv version, so a new one would
          # change every zip, and redeploy every function.
          version: 0.12.23
      - run: uv run --no-project scripts/build_lambda.py backend
      - run: uv run --no-project scripts/build_lambda.py ContentManagement/UpdatePhotoMetadata
      - run: uv run --no-project scripts/build_lambda.py ContentManagement/UpdateBlogPostMetadata
      - run: uv run --no-project scripts/build_lambda.py ContentManagement/UpdateBookReview
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambdas
          path: |
            backend/.build/lambda.zip
            ContentManagement/*/.build/lambda.zip
          include-hidden-files: true
          if-no-files-found: error

# Deploys to production: builds everything, then applies terraform/, which
# changes only what differs from what's deployed. Runs on every push to
# master, and on any branch when run by hand from the Actions tab.

name: Deploy

on:
  push:
    # TEMPORARY: ci, since "Run workflow" only appears once this file is on
    # master. Remove ci after merging.
    branches: [master, ci]
  workflow_dispatch:

permissions: {}

# Queue deploys rather than running them side by side, and never cancel one
# partway through.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  apply:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend
          path: frontend/build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambdas
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve

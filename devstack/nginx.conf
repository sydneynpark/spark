# The stack's one port, standing in for the site's separate hosts, so the
# frontend reaches everything at relative URLs (see frontend/.env.development):
#
#   /api/admin/*        AdminAPI  (api.spark.wiki/admin/*)
#   /api/*              ContentAPI (api.spark.wiki/*)
#   /cdn/birds/*        photos.spark.wiki: the bird photos bucket, and under
#                       /thumbnail/, the thumbnails bucket
#   /cdn/photos/*       normal-photos.spark.wiki: the other photos' bucket,
#                       and under /thumbnail/, the thumbnails bucket's
#                       normal-photos/
#   /cdn/books/*        books.spark.wiki: the books bucket
#   /aws/*              the AWS emulator itself, e.g. for ./dev aws
#   /*                  the frontend's dev server

# Docker's DNS. Containers are looked up when a request needs them, rather
# than once at startup, so this starts (and keeps working) while they come
# and go -- which is also why the upstreams below are variables.
resolver 127.0.0.11 valid=5s ipv6=off;

# Paths with their prefix stripped, taken from $request_uri so they're passed
# on exactly as the browser encoded them (keys have spaces and the like).
map $request_uri $api_path {
    ~^/api(?<rest>/.*)$ $rest;
}
map $request_uri $aws_path {
    ~^/aws(?<rest>/.*)$ $rest;
}
map $request_uri $birds_key {
    ~^/cdn/birds/(?<rest>.*)$ $rest;
}
map $request_uri $photos_key {
    ~^/cdn/photos/(?<rest>.*)$ $rest;
}
map $request_uri $books_key {
    ~^/cdn/books/(?<rest>.*)$ $rest;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    client_max_body_size 0;
    proxy_http_version 1.1;

    set $content_api content-api:8000;
    set $admin_api admin-api:8000;
    set $aws aws:5000;
    set $frontend frontend:3000;

    location /api/ {
        proxy_pass http://$content_api$api_path;
    }

    location /api/admin/ {
        proxy_pass http://$admin_api$api_path;

        # AdminAPI reaches S3 through this proxy, at http://edge/aws, so the
        # presigned upload URLs it hands out point here too. This points them
        # at whatever host and port the browser used to get here instead.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'http://edge/aws/' '$scheme://$http_host/aws/';
    }

    # The CDNs only serve, as CloudFront does here. The emulator lets them
    # read their buckets anonymously (see devstack/seed.py), as the buckets'
    # policies let CloudFront.
    location /cdn/birds/ {
        limit_except GET { deny all; }
        proxy_pass http://$aws/spark.wiki.photos/$birds_key;
    }

    location /cdn/birds/thumbnail/ {
        limit_except GET { deny all; }
        # Like CloudFront's /thumbnail/* behavior, the whole path is the key.
        proxy_pass http://$aws/spark.wiki.thumbnails/$birds_key;
    }

    location /cdn/photos/ {
        limit_except GET { deny all; }
        proxy_pass http://$aws/spark.wiki.normal-photos/$photos_key;
    }

    location /cdn/photos/thumbnail/ {
        limit_except GET { deny all; }
        # Like the CloudFront origin's path, normal-photos/ goes in front.
        proxy_pass http://$aws/spark.wiki.thumbnails/normal-photos/$photos_key;
    }

    location /cdn/books/ {
        limit_except GET { deny all; }
        proxy_pass http://$aws/spark.wiki.books/$books_key;
    }

    location /aws/ {
        proxy_request_buffering off;
        proxy_pass http://$aws$aws_path;
    }

    # The emulator's dashboard, which loads its assets from here.
    location /moto-api/ {
        proxy_pass http://$aws;
    }

    location / {
        proxy_pass http://$frontend;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

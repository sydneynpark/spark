# The site, and stand-ins for the AWS services it runs on, for local
# development. Start it with ./dev up (see README.md), which gives each
# checkout its own Compose project and port, so worktrees can run side by side
# without sharing containers, data, or ports.

x-aws-env: &aws-env
  # boto3 sends every AWS call to the emulator rather than AWS. These
  # credentials are placeholders: no real ones are ever mounted in.
  AWS_ENDPOINT_URL: http://aws:5000
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

# The Python services' images only hold dependencies. The source is mounted
# from the checkout, so edits apply without a rebuild.
x-backend: &backend
  build:
    context: .
    dockerfile: devstack/python.Dockerfile
    target: backend
  volumes:
    - .:/repo:ro
  environment: *aws-env

services:
  # The only published port. It stands in for API Gateway (/api), the
  # CloudFront CDNs (/cdn), and AWS's endpoints (/aws), in front of the
  # frontend (see devstack/nginx.conf).
  edge:
    image: nginx:1.28.0-alpine
    ports:
      - "${SPARK_PORT:?start the stack with ./dev up, which picks this checkout's port}:80"
    volumes:
      - ./devstack/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # S3, DynamoDB, SSM Parameter Store, and SQS, in memory: nothing is kept
  # once it stops, and seed sets it all up again.
  aws:
    image: motoserver/moto:5.2.3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/data.json')"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Creates what terraform/ manages in AWS, and uploads sample-data/ into it.
  seed:
    <<: *backend
    environment:
      <<: *aws-env
      # Optional: book reviews get covers, genres, and synopses only with these
      # (see README.md).
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    command: python /repo/devstack/seed.py
    depends_on:
      aws:
        condition: service_healthy

  # ContentAPI and AdminAPI (backend/README.md), each its own server, as each
  # is its own Lambda in AWS.
  content-api:
    <<: *backend
    working_dir: /repo/backend/src
    command: flask --app lambda_function:app run --debug --host 0.0.0.0 --port 8000
    depends_on:
      aws:
        condition: service_healthy

  admin-api:
    <<: *backend
    working_dir: /repo/backend/src
    environment:
      <<: *aws-env
      # Through the edge, so the presigned upload URLs it hands out point
      # somewhere the browser can reach (see devstack/nginx.conf).
      AWS_ENDPOINT_URL_S3: http://edge/aws
    command: flask --app admin_lambda_function:app run --debug --host 0.0.0.0 --port 8000
    depends_on:
      aws:
        condition: service_healthy
      edge:
        condition: service_started

  # The content Lambdas, run on the content buckets' S3 events.
  lambdas:
    <<: *backend
    build:
      context: .
      dockerfile: devstack/python.Dockerfile
      target: lambdas
    command: python /repo/devstack/lambda_trigger.py
    depends_on:
      seed:
        condition: service_completed_successfully

  frontend:
    image: node:22.21.0-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - ./devstack/frontend-start.sh:/usr/local/bin/frontend-start.sh:ro
      # This checkout's own, Linux, node_modules, rather than the host's.
      - frontend-node-modules:/app/node_modules
      - npm-cache:/root/.npm
    environment:
      BROWSER: none
      # Hot reload's websocket connects back through the edge's port.
      WDS_SOCKET_PORT: "0"
    command: frontend-start.sh

volumes:
  frontend-node-modules:
  # Shared by every checkout's stack, so a new worktree's npm ci is quick.
  # ./dev up creates it, and ./dev destroy leaves it for the others.
  npm-cache:
    name: spark-npm-cache
    external: true
